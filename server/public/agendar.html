<!doctype html>
<html lang="pt-BR" style="background:#f7f0e1">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Agendar serviço — Estância Salvarte</title>
<link rel="icon" href="/img/favicon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app-header"></div>
<section class="container mt-2">
  <div class="section-title">
    <h2>Agendar um serviço</h2>
    <p>Confecção sob medida, ajustes e atendimento personalizado. Envie sua solicitação e aguarde a confirmação.</p>
  </div>
  <div class="form-card">
    <label>Serviço desejado</label>
    <select id="a-servico"><option value="">Carregando...</option></select>
    <p id="a-servico-cobranca" style="font-size:.85rem;color:var(--texto-suave);margin:-.4rem 0 1rem;"></p>
    <div class="linha-dupla">
      <div><label>Data desejada</label><input id="a-data" type="date"></div>
      <div><label>Horário</label><input id="a-horario" type="time"></div>
    </div>
    <label>Local (loja, oficina, endereço do cliente...)</label>
    <input id="a-local">
    <div class="linha-dupla">
      <div><label>Responsável pela contratação</label><input id="a-responsavel"></div>
      <div><label>Telefone para contato</label><input id="a-telefone"></div>
    </div>
    <label>Observações</label>
    <textarea id="a-obs" placeholder="Detalhes do serviço, medidas, referências..."></textarea>

    <button class="btn mt-2" id="btn-agendar" style="width:100%;">Enviar solicitação</button>
    <p id="msg-agenda" class="msg" style="display:none;"></p>
  </div>
</section>
<div id="app-footer"></div>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
let SERVICOS = [];

// Texto da forma de cobrança, pro cliente saber o que esperar antes de enviar
// a solicitação (o valor final continua sendo combinado na confirmação).
function textoCobrancaServico(s) {
  if (s.tipo_cobranca === 'tempo') {
    const unidade = { dias: 'dia', horas: 'hora', minutos: 'minuto' }[s.unidade_tempo] || s.unidade_tempo;
    return `${formatarMoeda(s.valor_unidade)} por ${unidade}`;
  }
  return `${formatarMoeda(s.valor_fixo)} (valor fechado)`;
}

async function carregarServicos() {
  const select = document.getElementById('a-servico');
  try {
    SERVICOS = await Api.get('/api/servicos');
    select.innerHTML = '<option value="">Selecione um serviço...</option>'
      + SERVICOS.map(s => `<option value="${s.id}">${escapeHtml(s.nome)}</option>`).join('');
  } catch (e) {
    select.innerHTML = '<option value="">Não foi possível carregar os serviços</option>';
  }
  atualizarCobranca();
}

function atualizarCobranca() {
  const servico = SERVICOS.find(s => String(s.id) === document.getElementById('a-servico').value);
  const texto = document.getElementById('a-servico-cobranca');
  texto.textContent = servico
    ? `Cobrança: ${textoCobrancaServico(servico)}${servico.descricao ? ' — ' + servico.descricao : ''}`
    : '';
}

document.getElementById('a-servico').addEventListener('change', atualizarCobranca);
carregarServicos();

document.getElementById('btn-agendar').addEventListener('click', async () => {
  const msg = document.getElementById('msg-agenda');
  try {
    const resp = await Api.post('/api/agendamentos', {
      servico_id: document.getElementById('a-servico').value,
      data_servico: document.getElementById('a-data').value,
      horario: document.getElementById('a-horario').value,
      local: document.getElementById('a-local').value,
      responsavel: document.getElementById('a-responsavel').value,
      telefone_contato: document.getElementById('a-telefone').value,
      observacoes: document.getElementById('a-obs').value
    });
    msg.textContent = resp.mensagem; msg.className = 'msg sucesso'; msg.style.display = 'block';
  } catch (e) {
    msg.textContent = e.message; msg.className = 'msg erro'; msg.style.display = 'block';
  }
});
</script>
</body>
</html>
